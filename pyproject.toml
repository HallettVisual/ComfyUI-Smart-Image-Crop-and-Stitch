[project]
name = "smart-image-crop-and-stitch"
version = "2.1.3"
description = "Mask-driven smart crop and stitch nodes for ComfyUI inpaint and edit workflows."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "HallettVisual" }
]
dependencies = [
    "opencv-python>=4.8"
]
classifiers = [
    "Operating System :: OS Independent"
]

[project.urls]
Repository = "https://github.com/HallettVisual/ComfyUI-Smart-Image-Crop-and-Stitch"
"Bug Tracker" = "https://github.com/HallettVisual/ComfyUI-Smart-Image-Crop-and-Stitch/issues"

[tool.comfy]
PublisherId = "hallettvisual"
DisplayName = "Smart Image Crop and Stitch"
Icon = ""

[tool.black]
line-length = 120
